name: Build NotificationLog APK

concurrency:
  group: notificationlog-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/emulator" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          NOTIFICATIONLOG_KEYSTORE_BASE64: ${{ secrets.NOTIFICATIONLOG_KEYSTORE_BASE64 }}
        run: |
          test -n "$NOTIFICATIONLOG_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/notificationlog"
          printf '%s' "$NOTIFICATIONLOG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/notificationlog/release.keystore"
          chmod 600 "$RUNNER_TEMP/notificationlog/release.keystore"

      - name: Build debug and release APKs
        env:
          NOTIFICATIONLOG_KEYSTORE_PATH: ${{ runner.temp }}/notificationlog/release.keystore
          NOTIFICATIONLOG_STORE_PASSWORD: ${{ secrets.NOTIFICATIONLOG_STORE_PASSWORD }}
          NOTIFICATIONLOG_KEY_ALIAS: ${{ secrets.NOTIFICATIONLOG_KEY_ALIAS }}
          NOTIFICATIONLOG_KEY_PASSWORD: ${{ secrets.NOTIFICATIONLOG_KEY_PASSWORD }}
        run: |
          test -n "$NOTIFICATIONLOG_STORE_PASSWORD"
          test -n "$NOTIFICATIONLOG_KEY_ALIAS"
          test -n "$NOTIFICATIONLOG_KEY_PASSWORD"
          gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NotificationLog-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove legacy release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v --yes >/dev/null 2>&1 || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v" >/dev/null 2>&1 || true
          gh release delete v1.0.1 --yes >/dev/null 2>&1 || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.0.1" >/dev/null 2>&1 || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          TAG="v$VERSION_NAME"
          RELEASE_SHA="$(git rev-parse HEAD)"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$RELEASE_SHA" -F force=true >/dev/null 2>&1 || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            --target "${GITHUB_SHA}" \
            --title "NotificationLog $TAG" \
            --generate-notes
